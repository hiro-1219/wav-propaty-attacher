name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      BUILD_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'development' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: true
      - name: Install Wails Linux dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
      - name: Test and vet
        run: |
          go test ./...
          go vet ./...
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          wails build -trimpath -webview2 error -ldflags "-X wav-property-attacher/internal/workflow.AppVersion=$env:BUILD_VERSION"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/bin/wav-property-attacher.exe dist/wav-property-attacher.exe
      - name: Build (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          tags=""
          if [ "${{ runner.os }}" = "Linux" ]; then tags="-tags webkit2_41"; fi
          wails build -trimpath $tags -ldflags "-X wav-property-attacher/internal/workflow.AppVersion=$BUILD_VERSION"
          cp -R build/bin/. dist/
      - name: Bundle fpcalc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = 'https://github.com/acoustid/chromaprint/releases/download/v1.6.1/chromaprint-fpcalc-1.6.1-windows-x86_64.zip'
          $archive = Join-Path $env:RUNNER_TEMP 'fpcalc.zip'
          $unpack = Join-Path $env:RUNNER_TEMP 'fpcalc-windows'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          $expected = '735d6182b38e9f364b84ce6f4ccd682c75e2851de89735711d6b762d12b92a4e'
          if ($actual -ne $expected) { throw "fpcalc checksum mismatch: $actual" }
          Expand-Archive -LiteralPath $archive -DestinationPath $unpack
          New-Item -ItemType Directory -Force dist/tools | Out-Null
          Copy-Item (Get-ChildItem $unpack -Recurse -Filter fpcalc.exe | Select-Object -First 1).FullName dist/tools/fpcalc.exe
      - name: Bundle fpcalc (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            asset="chromaprint-fpcalc-1.6.1-macos-universal.tar.gz"
            expected="240aeb5a8c8205af458e3625cb7487b826b711a999e491ef00111f3cebd76f00"
          else
            asset="chromaprint-fpcalc-1.6.1-linux-x86_64.tar.gz"
            expected="fc16cd37a70168040bc9ceb45f1d4d1216f5a75bc4c9cf8564bea70ac6a45733"
          fi
          archive="$RUNNER_TEMP/$asset"
          curl --fail --location --retry 3 \
            "https://github.com/acoustid/chromaprint/releases/download/v1.6.1/$asset" \
            --output "$archive"
          actual="$(shasum -a 256 "$archive" | cut -d ' ' -f 1)"
          test "$actual" = "$expected"
          mkdir -p "$RUNNER_TEMP/fpcalc" dist/tools
          tar -xzf "$archive" -C "$RUNNER_TEMP/fpcalc"
          find "$RUNNER_TEMP/fpcalc" -type f -name fpcalc -exec cp {} dist/tools/fpcalc \;
          chmod +x dist/tools/fpcalc
      - name: Add notices
        shell: bash
        run: |
          mkdir -p dist/licenses
          cp LICENSE THIRD_PARTY_NOTICES.md dist/licenses/
          cp third_party/chromaprint-LICENSE.md dist/licenses/
          cp third_party/wails-LICENSE.txt dist/licenses/
      - uses: actions/upload-artifact@v4
        with:
          name: wav-property-attacher-${{ runner.os }}-${{ runner.arch }}
          path: dist/
      - name: Package release asset (Windows)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows'
        shell: pwsh
        run: |
          $arch = switch ($env:RUNNER_ARCH) {
            'X64' { 'x86_64' }
            'ARM64' { 'arm64' }
            default { $env:RUNNER_ARCH.ToLowerInvariant() }
          }
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $asset = "release-assets/wav-property-attacher-$env:GITHUB_REF_NAME-windows-$arch.zip"
          Compress-Archive -Path dist/* -DestinationPath $asset
      - name: Package release asset (macOS/Linux)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_ARCH" in
            X64) arch="x86_64" ;;
            ARM64) arch="arm64" ;;
            *) arch="$(printf '%s' "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')" ;;
          esac
          case "${{ runner.os }}" in
            macOS) platform="macos" ;;
            Linux) platform="linux" ;;
          esac
          mkdir -p release-assets
          asset="release-assets/wav-property-attacher-${GITHUB_REF_NAME}-${platform}-${arch}.tar.gz"
          tar -C dist -czf "$asset" .
      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-asset-${{ runner.os }}-${{ runner.arch }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate version tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-asset-*
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum *.zip *.tar.gz | sort -k2 > SHA256SUMS.txt
      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --verify-tag \
              --generate-notes \
              --title "WAV Property Attacher $GITHUB_REF_NAME"
          fi
